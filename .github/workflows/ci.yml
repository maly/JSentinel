name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # setup-python poskytuje i příkaz `python`, který používá `npm run test:serve`
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check python command
        run: python --version

      - run: npm ci

      - name: Tests (Node + Python)
        run: npm test

      - name: Build
        run: npm run build

